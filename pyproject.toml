[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-personal-agent"
version = "0.5.0"
description = "A personal Telegram voice agent with Hermes and local evidence-based memory"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-genai>=1.75,<2",
  "telethon>=1.45,<2", "python-dotenv>=1.2,<2", "numpy>=2.4,<3",
  "soxr>=1.1,<2", "aiohttp>=3.14,<4", "platformdirs>=4,<5",
  "tzdata>=2025.1", "pypdf>=6,<7", "openpyxl>=3.1,<4", "filelock>=3.20,<4", "psutil>=7,<9"
]

[project.optional-dependencies]
calls = ["py-tgcalls==2.3.3", "ntgcalls==2.2.5", "imageio-ffmpeg>=0.6,<1"]
semantic = ["fastembed>=0.9.1,<1"]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "build>=1,<2",
    "playwright>=1.55,<2",
]
desktop = [
    "pywebview>=6.2.1,<7",
]

[project.scripts]
hpa = "hermes_personal_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_personal_agent"]

[tool.hatch.build.targets.sdist]
include = ["src", "scripts", "tests", "docs", "README.md", "LICENSE", "SECURITY.md", "PRODUCT.md", "DESIGN.md", ".impeccable/design.json", "start-web.cmd", "pyproject.toml", "uv.lock", "Dockerfile", "compose.yaml", "compose.coolify.yaml", "docker-compose.prod.yml", "install.cmd", ".github", ".env.example", ".dockerignore", ".gitignore", ".gitattributes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
